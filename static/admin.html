<style>

const isNew=i>=L[k].length,orig=isNew?null:L[k][i],bi=i<B[k].length?B[k][i]:null,cats=[...new Set(A.map(y=>y[0]))].sort();

const blob=(t,q)=>new Promise(r=>c.toBlob(r,t,q));let b=await blob("image/webp",.85);if(!b||b.type!=="image/webp")b=await blob("image/jpeg",.85);return b&&b.size<f.size?b:f}

m.querySelectorAll("[data-oh],[data-oo]").forEach(b=>b.onclick=async()=>{if(b.dataset.oh&&!confirm("Закрыть это предложение? Автор его больше не увидит в ленте."))return;b.disabled=true;try{await api(X(`obmen/${b.dataset.oh||b.dataset.oo}/${b.dataset.oh?"hide":"open"}`),{method:"POST"})}catch(e){alert(e.message)}obmSec()})}
async function bcSec(){const m=$("#m");m.innerHTML=`<h1>Рассылка</h1><p class="sub">Одно сообщение от бота с кнопкой «Открыть». Сначала пришли пробное себе. Анонсы — только когда сам сыграл и одобрил. Тем, у кого доступ закрыт по жалобам, не уходит.</p><div id="bb" class="empty">Загружаю…</div>`;
const d=await xload("bb","bc","BC");if(!d)return;
$("#bb").outerHTML=`<div class="box"><label>Текст</label><textarea id="bt" rows="6" maxlength="2000" placeholder="Например: 🌱 В «Ну-ну» появился обмен излишками — загляни, что предлагают друзья."></textarea>
<label>Кому</label><select id="bs">${Object.entries(d.segments).map(([k,t])=>`<option value="${k}">${t} — ${d.counts[k]}</option>`).join("")}</select>
<div class="g3"><div><label>Мой Telegram ID (для пробного)</label><input id="bme" value="${d.me||""}" placeholder="Можно отметить в «Люди» → «Это я»"></div></div>
${d.run.on?`<p class="ok">Идёт рассылка: ${d.run.sent} из ${d.run.total}${d.run.fail?`, не дошло ${d.run.fail}`:""}…</p>`:d.run.total?`<p class="hint">Прошлая рассылка: дошло ${d.run.sent} из ${d.run.total}${d.run.fail?`, не дошло ${d.run.fail} (заблокировали бота или не писали /start)`:""}.</p>`:""}
<div class="bar"><button class="s" id="btt">Пробное — себе</button><button class="p" id="bgo"${d.run.on?" disabled":""}>Разослать</button></div></div>`;
$("#btt").onclick=async()=>{if(!$("#bt").value.trim())return alert("Напиши текст");try{await api(X("bc"),{method:"POST",body:J({text:$("#bt").value,test:true,uid:+$("#bme").value})});alert("Пробное отправлено — проверь Telegram")}catch(e){alert(e.message)}};
$("#bgo").onclick=async()=>{const o=$("#bs").selectedOptions[0];if(!$("#bt").value.trim())return alert("Напиши текст");if(!confirm(`Отправить: ${o.textContent}?`))return;try{await api(X("bc"),{method:"POST",body:J({text:$("#bt").value,segment:o.value})});setTimeout(bcSec,1500)}catch(e){alert(e.message)}}}
async function remSec(){const m=$("#m");m.innerHTML=`<h1>Напоминания</h1><p class="sub">Бот напоминает о делах без часа и о саде. Дела, у которых игрок сам выбрал час, приходят в свой час. Сохраняется сразу, перезапуск не нужен.</p><div id="rb2" class="empty">Загружаю…</div>`;
const d=await xload("rb2","remind","REM");if(!d)return;
$("#rb2").outerHTML=`<div class="box"><label class="chk"><input type="checkbox" id="ron"${d.on?" checked":""}> Напоминания включены (выключить — замолчат все, и дела с часом тоже)</label>
<div class="g3"><div><label>Утренние — в час по Киеву</label><input id="rh" type="number" min="3" max="23" value="${d.hour}"></div><div><label>Про сад — не чаще раза в, дней</label><input id="rg" type="number" min="1" max="60" value="${d.garden_every}"></div></div>
<div class="bar"><button class="p" id="rsv2">Сохранить</button></div></div>`;
$("#rsv2").onclick=async()=>{try{await api(X("remind"),{method:"PUT",body:J({on:$("#ron").checked,hour:+$("#rh").value,garden_every:+$("#rg").value})});remSec()}catch(e){alert(e.message)}}}
async function pgSec(){const m=$("#m");m.innerHTML=`<h1>Страницы сайта</h1><p class="sub">Статьи для поиска Google. Сохраняется сразу. Пустое поле — вернётся текст из кода. Текст статьи — HTML, как в коде (абзацы &lt;p&gt;, заголовки &lt;h2&gt;). Заголовок и текст обмена — в разделе «Обмен». Свод правил меняется через Claude: игроки его принимают, и смена сути требует новой версии.</p><div id="gb" class="empty">Загружаю…</div>`;
const d=await xload("gb","pages","PG");if(!d)return;
$("#gb").outerHTML=Object.entries(d.pages).map(([k,p])=>`<div class="box"><h3>/${k}${d.changed.includes(k)?' <span class="tag ch">изменено</span>':""} <a class="s" href="/${k}" target="_blank" rel="noopener">открыть</a></h3>
<label>Заголовок в поиске (title)</label><input data-f="title" data-p="${k}" value="${esc(p.title)}"><label>Описание в поиске</label><textarea data-f="desc" data-p="${k}" rows="2">${esc(p.desc)}</textarea>
<label>Заголовок на странице</label><input data-f="h1" data-p="${k}" value="${esc(p.h1)}"><label>Текст статьи (HTML)</label><textarea data-f="body" data-p="${k}" rows="12" style="font-family:monospace;font-size:12px">${esc(p.body)}</textarea>
<div class="bar"><button class="p" data-sv="${k}">Сохранить /${k}</button></div></div>`).join("");
m.querySelectorAll("[data-sv]").forEach(b=>b.onclick=async()=>{const k=b.dataset.sv,o={};m.querySelectorAll(`[data-p="${k}"]`).forEach(e=>o[e.dataset.f]=e.value);try{await api(X("pages/"+k),{method:"PUT",body:J(o)});pgSec()}catch(e){alert(e.message)}})}
async function sysSec(){const m=$("#m");m.innerHTML=`<h1>Копия базы</h1><p class="sub">Все данные игры, обмена и админки — в одном файле nunu.db. Скачай копию перед большими изменениями и время от времени. Храни её у себя: в ней личные данные игроков.</p><div id="yb" class="empty">Загружаю…</div>`;
const d=await xload("yb","sys","SYS");if(!d)return;
$("#yb").outerHTML=`<div class="tiles"><div class="tile"><b>${d.db_mb} МБ</b><span>база</span></div><div class="tile"><b>${d.tiles_mb} МБ</b><span>снимки спутника (кэш)</span></div><div class="tile"><b>${d.up_h} ч</b><span>работает без перезапуска</span></div></div>
<div class="box"><div class="bar" style="border:0;margin:0;padding:0"><button class="p" id="ybk">Скачать копию базы</button></div></div>
<div class="box"><h3>Последние предупреждения и ошибки (с последнего запуска)</h3>${d.errors.length?tbl(["Когда","Где","Что"],d.errors.map(e=>`<tr><td>${e.at}</td><td>${esc(e.where)}</td><td>${e.lvl==="WARNING"?"":`<span class="tag ch">${e.lvl}</span> `}${esc(e.msg)}</td></tr>`)):`<p class="hint">Пусто — всё спокойно.</p>`}</div>`;
$("#ybk").onclick=async()=>{const b=$("#ybk");b.disabled=true;b.textContent="Готовлю…";try{const r=await fetch("/nunu/admin/api/x/backup",{headers:{"X-Admin-Key":KEY}});if(!r.ok)throw new Error("Ошибка "+r.status);
const a=document.createElement("a");a.href=URL.createObjectURL(await r.blob());a.download=(r.headers.get("content-disposition")||"").match(/filename="?([^"]+)/)?.[1]||"nunu.db";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}catch(e){alert(e.message)}b.disabled=false;b.textContent="Скачать копию базы"}}
/* ---------- публикация ---------- */
async function pub(){const m=$("#m"),C=changes(),nm=(k,i)=>k==="SW"?"Дела недели":k==="LP"?"Лендинг (главная сайта)":k==="T"?"Названия":`${KINDS[k].t} · №${i+1}`;
m.innerHTML=`<h1>Публикация</h1><p class="sub">Черновик видишь только ты. После публикации правки сразу видят все игроки при следующем открытии.</p>
<div class="box"><h3>Что изменится (${C.length})</h3>${C.length?`<table>${C.map(([k,i,w])=>`<tr><td>${esc(nm(k,i))}</td><td>${w}</td><td>${KINDS[k]?`<button class="s" data-go="${k}:${i}">Открыть</button>`:`<button class="s" data-go="${k}:0">Открыть</button>`}</td></tr>`).join("")}</table>`:`<p class="hint">Черновик совпадает с опубликованным.</p>`}
${errs.length?`<div class="err"><b>Не опубликовано, поправь:</b><ul>${errs.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}${msg?`<div class="ok">${esc(msg)}</div>`:""}
<label>Заметка к версии</label><input id="note" maxlength="200" placeholder="Например: 5 новых ситуаций про работу">
<div class="bar"><button class="p" id="go"${C.length?"":" disabled"}>Опубликовать</button><button id="rst"${C.length?"":" disabled"}>Сбросить черновик</button></div>
<p class="hint">Добавил или скрыл карточку — у новых партий будет новая колода; уже начатые партии доиграют своими карточками.</p></div>
<div class="box"><h3>История версий</h3><div id="hv" class="hint">Загружаю…</div></div>
<div class="box"><h3>Резервная копия</h3><div class="bar" style="border:0;padding:0"><button id="exp">Скачать черновик (JSON)</button><label class="s" style="margin:0"><button id="impb">Загрузить из файла в черновик</button><input type="file" id="imp" accept=".json,application/json" hidden></label></div></div>`;
m.onclick=e=>{const g=e.target.closest("[data-go]");if(g){const[k,i]=g.dataset.go.split(":");sec=k;if(KINDS[k]){sel[k]=+i;q="";cat="";flt="all"}msg="";render()}};
$("#go").onclick=async()=>{errs=[];msg="";await saveDraft();try{const r=await api("publish",{method:"POST",body:J({note:$("#note").value})});
msg=`Опубликовано: версия ${r.v}${r.deck?`, новые партии пойдут по колоде №${r.deck}`:""}.`;await load();sec="pub"}catch(e){errs=e.j&&e.j.detail&&e.j.detail.errors||[e.message]}render()};
$("#rst").onclick=async()=>{if(!confirm("Выбросить все неопубликованные правки?"))return;W=clone(L);W.T=W.T||{};W.H=W.H||{};W.LP=W.LP||clone(L.LP);await api("draft",{method:"PUT",body:"null"});state="";errs=[];msg="Черновик сброшен";render()};
$("#exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(W,null,1)],{type:"application/json"}));a.download=`nunu-content-${new Date().toISOString().slice(0,10)}.json`;a.click()};
$("#impb").onclick=()=>$("#imp").click();$("#imp").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.S)||!Array.isArray(d.SW))throw 0;W=d;W.T=W.T||{};W.H=W.H||{};W.LP=W.LP||clone(L.LP);await saveDraft();msg="Файл загружен в черновик — проверь и опубликуй";render()}catch(x){errs=["Это не файл с содержимым «Ну-ну»"];render()}};
try{hist=await api("versions")}catch(e){return}if(sec!=="pub"||!$("#hv"))return;$("#hv").outerHTML=hist.length?`<table><tr><th>Версия</th><th>Когда (UTC)</th><th>Заметка</th><th></th></tr>${hist.map(h=>`<tr><td>${h.v}${h.v===VER?' <span class="tag new">сейчас</span>':""}</td><td>${esc(h.at)}</td><td>${esc(h.note)||"—"}</td><td>${h.v!==VER?`<button class="s" data-rv="${h.v}">В черновик</button>`:""}</td></tr>`).join("")}</table><p class="hint">«В черновик» загружает старую версию для правки; карточки, добавленные позже, останутся скрытыми.</p>`:`<p class="hint">Ещё ничего не публиковалось — в игре встроенные тексты.</p>`;
m.querySelectorAll("[data-rv]").forEach(b=>b.onclick=async()=>{if(changes().length&&!confirm("Текущий черновик заменится. Продолжить?"))return;const r=await api("restore/"+b.dataset.rv,{method:"POST"});W=r.draft;W.T=W.T||{};W.H=W.H||{};W.LP=W.LP||clone(L.LP);state="saved";msg=`Версия ${b.dataset.rv} в черновике`;render()})}
addEventListener("beforeunload",e=>{if(state==="dirty"||state==="saving"){saveDraft();e.preventDefault()}});
KEY?api("login",{method:"POST"}).then(load,()=>logout()):login();
</script></body></html>
