<script>
const S=[
["Свадьба","Свадьба друга, сто гостей. Тамада стучит вилкой по бокалу: «А теперь слово тому, кто испёк этот каравай!» Все оборачиваются на тебя. А у тебя полный рот салата.",["Встану и скажу: «Му-му-му!»","Подниму бокал и улыбнусь всем"],["Покраснею и махну рукой: «Не я»","Сделаю вид, что занят салатом"],["Прожую, встану и скажу тост","Покажу на соседа: «Это он пёк»"]],
["Дорога","Третий час в пробке, жара, кондиционер сломался. Сзади кто-то сигналит без перерыва, будто от этого поедем быстрее.",["Помашу ему в зеркало","Включу музыку погромче и подпою"],["Закрою глаза и выдохну","Надену наушники"],["Посигналю в ответ","Выйду и спрошу, что случилось"]],
["Дом","Ты месяц делал ремонт в своей комнате. Возвращаешься, а мама повесила на твою новую стену ковёр с оленями. «Так уютнее!»",["Обниму маму: «Спасибо, но давай без ковра»","Засмеюсь и сфоткаю оленей"],["Вздохну и закрою дверь","Сниму, когда она уйдёт"],["Сразу сниму","«Это моя комната!»"]],
["Друзья","Ночь, костёр в горах, гитара по кругу. Доходит до тебя: «Давай, твоя очередь!» А ты знаешь только три аккорда.",["Сыграю три аккорда, все подхватят","«Я лучше историю расскажу»"],["Передам гитару дальше","Подкину дров в костёр"],["Сыграю, и пусть кто-нибудь засмеётся","«Не умею и не буду»"]],
["Незнакомцы","Ты в маршрутке, утро, все сонные. Бабушка рядом достаёт пирожок и протягивает тебе: «На, худой какой!»",["Возьму и поблагодарю","Разговорюсь с ней"],["Вежливо откажусь","Сделаю вид, что сплю"],["«Спасибо, я не голодный»","«Я не худой, это стиль!»"]],
["Деньги","Ты нашёл на улице кошелёк. Внутри приличная сумма и фото ребёнка. Документов нет. Вокруг никого.",["Выложу пост, чтобы найти хозяина","Отнесу в ближайший магазин"],["Положу обратно, где лежал","Пройду мимо"],["Отнесу в полицию","Оставлю себе, раз нельзя найти"]],
["Признание","Ты неделю готовил сюрприз на день рождения друга. В разгар праздника он говорит: «Спасибо всем!» и благодарит человека, который просто принёс торт.",["Порадуюсь: главное, что ему хорошо","Подниму тост за всех, кто помогал"],["Промолчу и доем торт","Выйду подышать"],["Скажу ему потом наедине","Пошучу: «А торт, конечно, главное»"]],
["Природа","Ты на рыбалке, сидишь с утра. Ни одной поклёвки. Рядом мальчишка лет десяти таскает рыбу одну за другой и хихикает.",["Спрошу у него, на что ловит","Похвалю: «Ну ты мастер!»"],["Буду сидеть дальше","Смотаю удочки и уйду"],["Пересяду ближе к нему","«Это рыба меня не уважает»"]],
["Любовь","Кафе, первое свидание. Ты пролил чай прямо ей на платье. Официант уже бежит с салфетками, а все за соседними столиками смотрят.",["Рассмеюсь вместе с ней","Предложу свою куртку"],["Покраснею и буду извиняться","Молча вытру стол"],["«Зато теперь будет что вспомнить»","Закажу новый чай и продолжу"]],
["Свобода","Пятница, вечер. Начальник звонит: «Срочно нужно доделать к понедельнику, выходные отменяются». А у тебя на субботу уже куплены билеты на море.",["Предложу сделать часть сегодня","Позову коллегу помочь"],["Не возьму трубку","«Сделаю, если успею»"],["«Нет, у меня билеты»","«Сделаю, но за двойную оплату»"]],
["Друзья","День рождения друга в караоке. Микрофон суют тебе: «Твоя песня!» На экране уже бегут слова песни, которую ты слышишь впервые.",["Спою как получится, все подхватят","Позову кого-то спеть вдвоём"],["Отдам микрофон соседу","Уйду «за напитками»"],["Включу свою любимую вместо этой","Станцую вместо пения"]],
["Дом","Воскресенье, ты наконец выспался. В 7 утра у соседа за стеной начинает выть перфоратор. Минута, две, десять.",["Пойду спрошу, долго ли ещё","Предложу помочь, быстрее закончим"],["Накрою голову подушкой","Уйду гулять"],["Постучу в стену","Включу музыку погромче в ответ"]],
["Незнакомцы","Ты в лифте один. Заходит человек с огромной собакой. Собака садится прямо тебе на ноги и смотрит в глаза.",["Почешу её за ухом","Заговорю с хозяином про собаку"],["Замру и буду ждать своего этажа","Выйду на следующем"],["«Уберите собаку, пожалуйста»","Скажу собаке: «Ну и чего уставилась?»"]],
["Деньги","На кассе тебе случайно дали сдачу на 500 больше. Кассирша уставшая, очередь длинная, никто не заметил.",["Верну и пошучу","Верну и скажу «хорошего дня»"],["Не замечу, мне не до того","Подумаю об этом уже на улице"],["Оставлю, их ошибка","Верну, но потом, когда очередь схлынет"]],
["Любовь","Ты на концерте. Девушка рядом поёт громче всех, фальшиво, но так счастливо, что на неё оборачиваются. Ловит твой взгляд.",["Запою с ней вместе","Улыбнусь ей"],["Отвернусь к сцене","Отойду ближе к выходу"],["Покажу большой палец","«Громче, нас не слышно!»"]],
["Творчество","Ты долго рисовал открытку для мамы. Младший брат пролил на неё сок за пять минут до праздника.",["Дорисую пятно в солнце","Обниму брата: «Ничего, переживём»"],["Молча выброшу и куплю открытку","Подарю без открытки"],["Отругаю брата","Заставлю его рисовать новую вместе со мной"]],
["Друзья","Поход, третий день. Еда почти кончилась. Друг признаётся, что съел ночью последнюю шоколадку, которую «берегли на вершину».",["Посмеюсь и прощу","«Ладно, на вершине будет что-то другое»"],["Промолчу, но запомню","Отойду, чтобы не сорваться"],["«Ты серьёзно?!»","Заберу его порцию ужина в отместку"]],
["Дом","Семейный ужин. Тётя на весь стол: «Ну что, когда женишься?» Все замолкают и смотрят на тебя.",["«Как только найду такую, как ты, тётя»","Отвечу честно, как есть"],["Набью рот едой","Сменю тему на погоду"],["«Когда сам решу»","«А вы когда на пенсию?»"]],
["Незнакомцы","Поздний автобус. Пьяный мужчина садится рядом и начинает рассказывать тебе, как его все предали.",["Выслушаю, ему явно плохо","Спрошу, куда ему ехать"],["Надену наушники","Пересяду"],["«Извините, я устал»","Отвечу ему в тон, с юмором"]],
["Природа","Ты наконец выбрался на озеро. Только разложил плед, как на соседнее место приезжает компания с колонкой на полную громкость.",["Подойду познакомлюсь","Попрошу сделать потише, с улыбкой"],["Переберусь подальше","Уеду"],["Попрошу выключить","Включу свою музыку"]],

const fp=(p,seed)=>({id:p.id,name:p.name,s:p.s,g:p.g,seed,guess:p.guess,mark:p.mark});
async function join(sp,fid){const v=await API("/game/"+sp),md=v.mode==="hero"?"guess":"duo";
if(v.mine){const p=fid&&v.mode==="duo"&&v.plays.find(p=>p.id===fid);st={name:v.name,seed:v.seed,s:v.s,g:v.mode==="hero"?v.s:v.g,mode:v.mode,started:1,planted:1,gid:v.id,glink:v.link,guessers:[],
friend:p?fp(p,v.seed):null,story:v.story||null,only:v.story&&v.story.only?1:0,storyAsk:1,bottle:v.bottle};save();return}
st=v.played?{name:v.my.name,seed:v.seed,s:md==="guess"?v.my.g:v.my.s,g:v.my.g,mode:md,started:1,planted:1,join:sp,friend:{id:v.owner,name:v.name,s:v.s,g:v.g,seed:v.seed},story:v.story||null,only:v.story&&v.story.only?1:0,sg:v.my.guess||"",smark:v.my.mark,bottle:v.bottle,wish:v.my.wish}
:{name:st.name||tgName||"Друг",seed:v.seed,...(v.story&&v.story.only?{s:P10(),g:P10(),only:1}:{s:[],g:[]}),mode:md,started:1,join:sp,friend:{id:v.owner,name:v.name,pending:1},story:v.story||null,bottle:v.bottle};save()}
async function boot(){if(!API)return home();busy("Загружаю твой остров…");
try{const r=await API("/state"),d=r.data;tgName=r.name||"";
if(d){if(d.nunu2)st=d.nunu2;if(d["nunu-seeds"])seeds=d["nunu-seeds"];if(d["nunu-bridges"])bridges=d["nunu-bridges"];if(d["nunu-plot"])plot=d["nunu-plot"];if(d["nunu-prefs"]){prefs={...prefs,...d["nunu-prefs"]};ls.set("nunu-prefs",prefs);applyPrefs()}}else push();
/* общие дела от друзей: ложатся в сад, если такого ещё нет */
if(r.inbox&&r.inbox.length){r.inbox.forEach(x=>{if(!seeds.some(y=>y.pid&&y.pid===x.pid))seeds.push(x)});saveSeeds()}
const sp=(TG.initDataUnsafe||{}).start_param;
if(sp&&sp[0]==="m"){const r=await API("/meet/"+sp+"/accept","POST");if(r.bridge){focus=r.friend.id;return world()}
card(`<h2>Приглашение принято</h2><p style="margin:0">Мост появится, когда ${esc(r.friend.name)} тоже откроет приглашение. Бот напишет тебе.</p><button class="main-btn" id="mp">На карту</button>`);$("mp").onclick=world;return}
if(sp&&sp[0]==="i"){const r=await API("/invite/"+sp+"/accept","POST");if(r.friend)focus=r.friend.id;return world()}
/* открыли по ссылке на партию — сразу в неё (даже если это текущая); иначе дом — карта,
а недоигранная партия продолжается с того же места */
if(sp){if(sp!==st.gid&&sp!==st.join)await join(sp)}
else if(!(st.started&&st.g&&st.g.length>0&&st.g.length<N))return world()}catch(e){}
go()}
boot();
</script>
</body></html>
