<script>
const S=[
["Свадьба","Свадьба друга, сто гостей. Тамада стучит вилкой по бокалу: «А теперь слово тому, кто испёк этот каравай!» Все оборачиваются на тебя. А у тебя полный рот салата.",["Встану и скажу: «Му-му-му!»","Подниму бокал и улыбнусь всем"],["Покраснею и махну рукой: «Не я»","Сделаю вид, что занят салатом"],["Прожую, встану и скажу тост","Покажу на соседа: «Это он пёк»"]],
["Дорога","Третий час в пробке, жара, кондиционер сломался. Сзади кто-то сигналит без перерыва, будто от этого поедем быстрее.",["Помашу ему в зеркало","Включу музыку погромче и подпою"],["Закрою глаза и выдохну","Надену наушники"],["Посигналю в ответ","Выйду и спрошу, что случилось"]],
["Дом","Ты месяц делал ремонт в своей комнате. Возвращаешься, а мама повесила на твою новую стену ковёр с оленями. «Так уютнее!»",["Обниму маму: «Спасибо, но давай без ковра»","Засмеюсь и сфоткаю оленей"],["Вздохну и закрою дверь","Сниму, когда она уйдёт"],["Сразу сниму","«Это моя комната!»"]],
["Друзья","Ночь, костёр в горах, гитара по кругу. Доходит до тебя: «Давай, твоя очередь!» А ты знаешь только три аккорда.",["Сыграю три аккорда, все подхватят","«Я лучше историю расскажу»"],["Передам гитару дальше","Подкину дров в костёр"],["Сыграю, и пусть кто-нибудь засмеётся","«Не умею и не буду»"]],
["Незнакомцы","Ты в маршрутке, утро, все сонные. Бабушка рядом достаёт пирожок и протягивает тебе: «На, худой какой!»",["Возьму и поблагодарю","Разговорюсь с ней"],["Вежливо откажусь","Сделаю вид, что сплю"],["«Спасибо, я не голодный»","«Я не худой, это стиль!»"]],
["Деньги","Ты нашёл на улице кошелёк. Внутри приличная сумма и фото ребёнка. Документов нет. Вокруг никого.",["Выложу пост, чтобы найти хозяина","Отнесу в ближайший магазин"],["Положу обратно, где лежал","Пройду мимо"],["Отнесу в полицию","Оставлю себе, раз нельзя найти"]],
["Признание","Ты неделю готовил сюрприз на день рождения друга. В разгар праздника он говорит: «Спасибо всем!» и благодарит человека, который просто принёс торт.",["Порадуюсь: главное, что ему хорошо","Подниму тост за всех, кто помогал"],["Промолчу и доем торт","Выйду подышать"],["Скажу ему потом наедине","Пошучу: «А торт, конечно, главное»"]],
["Природа","Ты на рыбалке, сидишь с утра. Ни одной поклёвки. Рядом мальчишка лет десяти таскает рыбу одну за другой и хихикает.",["Спрошу у него, на что ловит","Похвалю: «Ну ты мастер!»"],["Буду сидеть дальше","Смотаю удочки и уйду"],["Пересяду ближе к нему","«Это рыба меня не уважает»"]],
["Любовь","Кафе, первое свидание. Ты пролил чай прямо ей на платье. Официант уже бежит с салфетками, а все за соседними столиками смотрят.",["Рассмеюсь вместе с ней","Предложу свою куртку"],["Покраснею и буду извиняться","Молча вытру стол"],["«Зато теперь будет что вспомнить»","Закажу новый чай и продолжу"]],
["Свобода","Пятница, вечер. Начальник звонит: «Срочно нужно доделать к понедельнику, выходные отменяются». А у тебя на субботу уже куплены билеты на море.",["Предложу сделать часть сегодня","Позову коллегу помочь"],["Не возьму трубку","«Сделаю, если успею»"],["«Нет, у меня билеты»","«Сделаю, но за двойную оплату»"]],
["Друзья","День рождения друга в караоке. Микрофон суют тебе: «Твоя песня!» На экране уже бегут слова песни, которую ты слышишь впервые.",["Спою как получится, все подхватят","Позову кого-то спеть вдвоём"],["Отдам микрофон соседу","Уйду «за напитками»"],["Включу свою любимую вместо этой","Станцую вместо пения"]],
["Дом","Воскресенье, ты наконец выспался. В 7 утра у соседа за стеной начинает выть перфоратор. Минута, две, десять.",["Пойду спрошу, долго ли ещё","Предложу помочь, быстрее закончим"],["Накрою голову подушкой","Уйду гулять"],["Постучу в стену","Включу музыку погромче в ответ"]],
["Незнакомцы","Ты в лифте один. Заходит человек с огромной собакой. Собака садится прямо тебе на ноги и смотрит в глаза.",["Почешу её за ухом","Заговорю с хозяином про собаку"],["Замру и буду ждать своего этажа","Выйду на следующем"],["«Уберите собаку, пожалуйста»","Скажу собаке: «Ну и чего уставилась?»"]],
["Деньги","На кассе тебе случайно дали сдачу на 500 больше. Кассирша уставшая, очередь длинная, никто не заметил.",["Верну и пошучу","Верну и скажу «хорошего дня»"],["Не замечу, мне не до того","Подумаю об этом уже на улице"],["Оставлю, их ошибка","Верну, но потом, когда очередь схлынет"]],
["Любовь","Ты на концерте. Девушка рядом поёт громче всех, фальшиво, но так счастливо, что на неё оборачиваются. Ловит твой взгляд.",["Запою с ней вместе","Улыбнусь ей"],["Отвернусь к сцене","Отойду ближе к выходу"],["Покажу большой палец","«Громче, нас не слышно!»"]],
["Творчество","Ты долго рисовал открытку для мамы. Младший брат пролил на неё сок за пять минут до праздника.",["Дорисую пятно в солнце","Обниму брата: «Ничего, переживём»"],["Молча выброшу и куплю открытку","Подарю без открытки"],["Отругаю брата","Заставлю его рисовать новую вместе со мной"]],
["Друзья","Поход, третий день. Еда почти кончилась. Друг признаётся, что съел ночью последнюю шоколадку, которую «берегли на вершину».",["Посмеюсь и прощу","«Ладно, на вершине будет что-то другое»"],["Промолчу, но запомню","Отойду, чтобы не сорваться"],["«Ты серьёзно?!»","Заберу его порцию ужина в отместку"]],
["Дом","Семейный ужин. Тётя на весь стол: «Ну что, когда женишься?» Все замолкают и смотрят на тебя.",["«Как только найду такую, как ты, тётя»","Отвечу честно, как есть"],["Набью рот едой","Сменю тему на погоду"],["«Когда сам решу»","«А вы когда на пенсию?»"]],
["Незнакомцы","Поздний автобус. Пьяный мужчина садится рядом и начинает рассказывать тебе, как его все предали.",["Выслушаю, ему явно плохо","Спрошу, куда ему ехать"],["Надену наушники","Пересяду"],["«Извините, я устал»","Отвечу ему в тон, с юмором"]],
["Природа","Ты наконец выбрался на озеро. Только разложил плед, как на соседнее место приезжает компания с колонкой на полную громкость.",["Подойду познакомлюсь","Попрошу сделать потише, с улыбкой"],["Переберусь подальше","Уеду"],["Попрошу выключить","Включу свою музыку"]],
["Признание","На работе ты придумал, как сэкономить кучу времени. На собрании начальник рассказывает об этом как о своей идее.",["Порадуюсь, что идея пошла","Подхвачу: «Да, мы это обсуждали»"],["Промолчу","Перестану предлагать идеи"],["«Это была моя идея»","Поговорю с ним после собрания"]],
["Деньги","Друг продаёт тебе свою старую машину «по-дружески». Через неделю она ломается, ремонт дороже половины цены.",["Позвоню ему, разберёмся вместе","Починю, дружба дороже"],["Не скажу ему ничего","Продам дальше и забуду"],["Попрошу вернуть часть денег","«Ты знал и не сказал?»"]],
["Свобода","Ты на работе. Приходит общее сообщение: «С понедельника камеры в каждом кабинете и отчёт о каждом часе».",["Обсужу с коллегами, что делать","Схожу к начальнику поговорить"],["Начну тихо искать другую работу","Привыкну"],["«Я не буду так работать»","Заклею камеру стикером"]],
["Любовь","Девушка, которая тебе нравится, просит помочь с переездом. На месте оказывается, что её парень тоже там и командует.",["Помогу, раз обещал","Познакомлюсь с ним по-доброму"],["Помогу и тихо уеду","Скажу, что срочно позвали"],["Уеду сразу","Пошучу: «Я думал, будет пицца»"]],
["Творчество","Ты выложил видео, где учишь печь хлеб. Первый комментарий: «Руки бы оторвать, кто так месит».",["«Покажи, как ты месишь»","Отвечу с юмором"],["Удалю комментарий","Не буду читать комментарии"],["Отвечу резко","Сниму второе видео назло"]],
["Дом","Ночь. Ты на кухне делаешь бутерброд. Включается свет, на пороге папа в трусах с тем же намерением.",["Сделаю бутерброд и ему","«Садись, пополуночничаем»"],["Быстро уйду с бутербродом","Сделаю вид, что пью воду"],["«Это мой бутерброд»","«Ну-ну, ночной дожор?»"]],
["Незнакомцы","Ты в чужом городе, заблудился, телефон сел. Идёт местный дед с тележкой.",["Спрошу дорогу","Предложу помочь с тележкой и спрошу"],["Буду искать сам","Дождусь, пока появится кто-то помоложе"],["Пойду куда глаза глядят","Найду кафе и зарядку"]],
["Друзья","Ты рассказываешь смешную историю, а друг перебивает и рассказывает её концовку раньше тебя. Все смеются над ним.",["Посмеюсь вместе со всеми","«Ты прям у меня украл!»"],["Махну рукой","Замолчу до конца вечера"],["«Дай я доскажу»","Расскажу историю про него"]],
["Природа","Ты в лесу за грибами. Час, два — пусто. Выходишь на поляну, а там всё в белых грибах. И соседка с корзиной идёт прямо к ним.",["Позову её: «Давай вместе!»","Покажу ей пару, остальное себе"],["Отойду, пусть она","Пойду дальше искать свои"],["Побегу собирать первым","«Это моя поляна!»"]],
["Признание","Школьная встреча выпускников. Однокласснику аплодируют за то, что он стал директором. Тебя спрашивают: «А ты чем занимаешься?»",["Расскажу с гордостью про своё дело","Расскажу и спрошу про всех"],["«Да так, всяким»","Отшучусь и уйду к столу"],["«Я сам себе директор»","Покажу фото своей печи"]],
["Деньги","Ты выиграл в лотерею небольшую сумму, как раз на месячный отдых. Об этом пока никто не знает.",["Порадую семью","Устрою праздник друзьям"],["Положу на счёт и забуду","Никому не скажу"],["Поеду в путешествие сам","Вложу в своё дело"]],
["Свобода","Ты живёшь с родителями. Друг на встрече громко говорит: «Ну ты когда уже съедешь, взрослый мужик?»",["«Помогай искать квартиру»","Расскажу, почему так"],["Промолчу","Сменю тему"],["«Тебе-то что?»","«Зато ипотеки нет»"]],
["Любовь","Ты месяц переписывался с девушкой. Первая встреча. Она приходит с подругой «для безопасности», и подруга всё время говорит за неё.",["Подружусь с обеими","Предложу погулять втроём"],["Подыграю и тихо уйду","Буду просто слушать"],["«А можно с тобой отдельно?»","Пошучу: «Я тоже взял бы друга»"]],
["Творчество","Тебя попросили сделать сайт для местного кафе «за бесплатный кофе». Работы на неделю.",["Сделаю, это будет моё портфолио","Предложу сделать попроще, но быстро"],["«Подумаю»","Не отвечу"],["«Кофе на год, и договорились»","«Бесплатно не работаю»"]],
["Дом","Ты чинил кран три часа. Мама заходит: «Так надо было мастера вызвать». Кран снова капает.",["«Помоги, подержи ключ»","Посмеюсь: «Мастер устал»"],["Брошу и уйду","Вызову мастера молча"],["«Сам починю, не мешай»","Буду чинить до победы"]],
["Незнакомцы","В кафе за соседним столиком парочка громко ругается. Девушка плачет. Парень встаёт и уходит, оставив ей счёт.",["Подойду, спрошу, всё ли в порядке","Передам ей салфетку"],["Отведу глаза","Доем и уйду"],["Скажу официанту, что заплачу за неё","Крикну парню вслед"]],
["Друзья","Друг зовёт тебя «на минутку» помочь с переездом. Приезжаешь, а там пианино на пятый этаж без лифта.",["Возьмусь, раз приехал","Позову ещё пару друзей"],["Найду причину уехать","Буду носить коробки, а не пианино"],["«На минутку, говоришь?»","«Пицца и пиво с тебя»"]],

const sc=G.map(f=>({n:f.name,p:f.g.reduce((a,x,k)=>a+hit(st.s[k],x),0)})).sort((a,b)=>b.p-a.p);
const ops=G.length?st.s.map((x,k)=>.32+.68*G.filter(f=>zone(f.g[k])===zone(x)).length/G.length):null;
let h=`<h1>Угадайте ${esc(st.name)}</h1><div class="card"><h2>Код для друзей</h2>${codeBox(code,"Разошли друзьям. Каждый вставляет код на старте, угадывает тебя и присылает свой код обратно.",msg)}</div>
<div class="card"><h2>Кто тебя знает лучше всех</h2>${sc.length?sc.map((r,k)=>`<div class="res" style="flex-direction:row;justify-content:space-between"><span>${k+1}. ${esc(r.n)}</span><b style="font-variant-numeric:tabular-nums">${r.p} из ${N*2}</b></div>`).join(""):`<p class="note" style="margin:0">Пока никого. Вставь код ответа друга.</p>`}
<div class="row"><input id="fc" placeholder="NF...-Имя"><button class="n" id="ok">Добавить</button></div><div class="err" id="e"></div></div>
<div class="card"><h2>Твой остров</h2>${island(st.s,st.s,ops)}<p class="note" style="margin:0">${G.length?"Чем ярче растение, тем больше друзей угадали этот ответ.":"Остров проявится, когда придут ответы друзей."}</p></div>
<button class="n" id="nw" style="align-self:flex-start">Новая игра</button>`;
app.innerHTML=h;wireCopy(msg);$("fc").oninput=()=>$("e").textContent="";
$("ok").onclick=()=>{const f=dec($("fc").value);if(!f||f.type!=="F"){$("e").textContent="Нужен код ответа друга, он начинается на NF.";return}if(f.seed!==st.seed){$("e").textContent="Друг угадывал другие ситуации. Пусть начнёт с твоего кода.";return}
st.guessers=G.filter(x=>x.name!==f.name).concat(f);save();heroShare()};
$("nw").onclick=()=>{st={name:st.name,s:[],g:[],friend:null};save();home()}}
function guessResult(){
const H=st.friend,hn=esc(H.name),L=["Не угадал","Почти угадал","Точно в цель"],code=enc("NF"),msg=`Я угадал тебя в «Ну-ну». Мой код: ${code}`;
let p=0;for(let k=0;k<N;k++)p+=hit(H.s[k],st.g[k]);
let h=`<h1>Как ты знаешь ${hn}</h1><div class="card"><div class="isl"><div style="background:var(--sand);color:var(--sand-fg)"><span class="note" style="color:inherit">Твой счёт</span><b>${p}</b>очков из ${N*2}</div></div>
<h2>Отправь код ${hn}</h2>${codeBox(code,"Так "+hn+" увидит тебя в рейтинге друзей.",msg)}</div><div class="card"><h2>По ситуациям</h2>`;
for(let k=0;k<N;k++){const a=hit(H.s[k],st.g[k]);h+=`<div class="res"><div class="s">${k+1}. ${sit(k)[1]}</div><div>${hn}: ${esc(opt(sit(k),H.s[k]))}</div><div class="note">Ты думал: ${esc(opt(sit(k),st.g[k]))} <span class="tag ${a?"open":"fog"}">${L[a].toLowerCase()}</span></div></div>`}
h+=`</div><button class="n" id="nw" style="align-self:flex-start">Новая игра</button>`;
app.innerHTML=h;wireCopy(msg);$("nw").onclick=()=>{st={name:st.name,s:[],g:[],friend:null};save();home()}}
function result(){
const f=st.friend,fn=esc(f.name),L=["Не угадал","Почти угадал","Точно в цель"];
let my=0,their=0;for(let k=0;k<N;k++){my+=hit(f.s[k],st.g[k]);their+=hit(st.s[k],f.g[k])}
let h=`<h1>Ну-ну: ${esc(st.name)} и ${fn}</h1><div class="card"><h2>Кто кого лучше знает</h2><div class="isl">
<div style="background:var(--sand);color:var(--sand-fg)"><span class="note" style="color:inherit">Ты угадал</span><b>${my}</b>очков из ${N*2}</div>
<div style="background:var(--sand);color:var(--sand-fg)"><span class="note" style="color:inherit">${fn} угадал</span><b>${their}</b>очков из ${N*2}</div></div>
<p class="note" style="margin:0">Участок угадан: 1 очко. Точное слово: 2 очка.</p></div><div class="card"><h2>По ситуациям</h2>`;
for(let k=0;k<N;k++){const s=sit(k),a=hit(st.s[k],f.g[k]),b=hit(f.s[k],st.g[k]);
h+=`<div class="res"><div class="s">${k+1}. ${s[1]}</div>
<div>Ты: ${esc(opt(s,st.s[k]))} <span class="tag ${a?"open":"fog"}">${fn}: ${L[a].toLowerCase()}</span></div>
<div>${fn}: ${esc(opt(s,f.s[k]))} <span class="tag ${b?"open":"fog"}">ты: ${L[b].toLowerCase()}</span></div></div>`}
h+=`</div>`;
[[st.s,f.g,"Твой остров"],[f.s,st.g,"Остров: "+fn]].forEach(([own,gs,title])=>{const c=[0,0,0],v=[0,0,0];let open=0;
own.forEach((x,k)=>{c[zone(x)]++;v[zone(gs[k])]++;if(zone(x)===zone(gs[k]))open++});
h+=`<div class="card"><h2>${title}</h2>${island(own,gs)}
<p class="note" style="margin:0">Сад ${c[0]} · лес ${c[1]} · скалы ${c[2]}. Яркое друг угадал (открытый берег ${open}), бледное в тумане (${N-open}).</p></div>`});
h+=`<div class="card"><h2>Отправь свой код ${fn}</h2><div style="font:500 16px var(--disp);word-break:break-all;background:var(--sand);color:var(--sand-fg);padding:12px;border-radius:10px;user-select:all">${esc(enc())}</div><p class="note" style="margin:0">Чтобы у друга открылись такие же результаты.</p></div><p class="note">Туман не ошибка, а повод спросить друг друга: «Почему ты так думал?»</p><div class="row"><button class="main-btn" id="bk">Мой код ещё раз</button><button class="n" id="nw">Сыграть с другим</button></div>`;
app.innerHTML=h;$("bk").onclick=()=>{st.friend=null;save();go()};$("nw").onclick=()=>{st={name:st.name,s:[],g:[],friend:null};save();home()}}
/* внутри Telegram ссылки на t.me открываем средствами Telegram */
document.addEventListener("click",e=>{const a=e.target.closest("a[href^='https://t.me/']");if(a&&TG){e.preventDefault();TG.openTelegramLink(a.href)}});
go();
</script>
</body></html>
