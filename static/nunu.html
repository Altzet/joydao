<script>
const S=[
["Свадьба","Свадьба друга, сто гостей. Тамада стучит вилкой по бокалу: «А теперь слово тому, кто испёк этот каравай!» Все оборачиваются на тебя. А у тебя полный рот салата.",["Встану и скажу: «Му-му-му!»","Подниму бокал и улыбнусь всем"],["Покраснею и махну рукой: «Не я»","Сделаю вид, что занят салатом"],["Прожую, встану и скажу тост","Покажу на соседа: «Это он пёк»"]],
["Дорога","Третий час в пробке, жара, кондиционер сломался. Сзади кто-то сигналит без перерыва, будто от этого поедем быстрее.",["Помашу ему в зеркало","Включу музыку погромче и подпою"],["Закрою глаза и выдохну","Надену наушники"],["Посигналю в ответ","Выйду и спрошу, что случилось"]],
["Дом","Ты месяц делал ремонт в своей комнате. Возвращаешься, а мама повесила на твою новую стену ковёр с оленями. «Так уютнее!»",["Обниму маму: «Спасибо, но давай без ковра»","Засмеюсь и сфоткаю оленей"],["Вздохну и закрою дверь","Сниму, когда она уйдёт"],["Сразу сниму","«Это моя комната!»"]],
["Друзья","Ночь, костёр в горах, гитара по кругу. Доходит до тебя: «Давай, твоя очередь!» А ты знаешь только три аккорда.",["Сыграю три аккорда, все подхватят","«Я лучше историю расскажу»"],["Передам гитару дальше","Подкину дров в костёр"],["Сыграю, и пусть кто-нибудь засмеётся","«Не умею и не буду»"]],
["Незнакомцы","Ты в маршрутке, утро, все сонные. Бабушка рядом достаёт пирожок и протягивает тебе: «На, худой какой!»",["Возьму и поблагодарю","Разговорюсь с ней"],["Вежливо откажусь","Сделаю вид, что сплю"],["«Спасибо, я не голодный»","«Я не худой, это стиль!»"]],
["Деньги","Ты нашёл на улице кошелёк. Внутри приличная сумма и фото ребёнка. Документов нет. Вокруг никого.",["Выложу пост, чтобы найти хозяина","Отнесу в ближайший магазин"],["Положу обратно, где лежал","Пройду мимо"],["Отнесу в полицию","Оставлю себе, раз нельзя найти"]],
["Признание","Ты неделю готовил сюрприз на день рождения друга. В разгар праздника он говорит: «Спасибо всем!» и благодарит человека, который просто принёс торт.",["Порадуюсь: главное, что ему хорошо","Подниму тост за всех, кто помогал"],["Промолчу и доем торт","Выйду подышать"],["Скажу ему потом наедине","Пошучу: «А торт, конечно, главное»"]],
["Природа","Ты на рыбалке, сидишь с утра. Ни одной поклёвки. Рядом мальчишка лет десяти таскает рыбу одну за другой и хихикает.",["Спрошу у него, на что ловит","Похвалю: «Ну ты мастер!»"],["Буду сидеть дальше","Смотаю удочки и уйду"],["Пересяду ближе к нему","«Это рыба меня не уважает»"]],
["Любовь","Кафе, первое свидание. Ты пролил чай прямо ей на платье. Официант уже бежит с салфетками, а все за соседними столиками смотрят.",["Рассмеюсь вместе с ней","Предложу свою куртку"],["Покраснею и буду извиняться","Молча вытру стол"],["«Зато теперь будет что вспомнить»","Закажу новый чай и продолжу"]],
["Свобода","Пятница, вечер. Начальник звонит: «Срочно нужно доделать к понедельнику, выходные отменяются». А у тебя на субботу уже куплены билеты на море.",["Предложу сделать часть сегодня","Позову коллегу помочь"],["Не возьму трубку","«Сделаю, если успею»"],["«Нет, у меня билеты»","«Сделаю, но за двойную оплату»"]],
["Друзья","День рождения друга в караоке. Микрофон суют тебе: «Твоя песня!» На экране уже бегут слова песни, которую ты слышишь впервые.",["Спою как получится, все подхватят","Позову кого-то спеть вдвоём"],["Отдам микрофон соседу","Уйду «за напитками»"],["Включу свою любимую вместо этой","Станцую вместо пения"]],
["Дом","Воскресенье, ты наконец выспался. В 7 утра у соседа за стеной начинает выть перфоратор. Минута, две, десять.",["Пойду спрошу, долго ли ещё","Предложу помочь, быстрее закончим"],["Накрою голову подушкой","Уйду гулять"],["Постучу в стену","Включу музыку погромче в ответ"]],
["Незнакомцы","Ты в лифте один. Заходит человек с огромной собакой. Собака садится прямо тебе на ноги и смотрит в глаза.",["Почешу её за ухом","Заговорю с хозяином про собаку"],["Замру и буду ждать своего этажа","Выйду на следующем"],["«Уберите собаку, пожалуйста»","Скажу собаке: «Ну и чего уставилась?»"]],
["Деньги","На кассе тебе случайно дали сдачу на 500 больше. Кассирша уставшая, очередь длинная, никто не заметил.",["Верну и пошучу","Верну и скажу «хорошего дня»"],["Не замечу, мне не до того","Подумаю об этом уже на улице"],["Оставлю, их ошибка","Верну, но потом, когда очередь схлынет"]],
["Любовь","Ты на концерте. Девушка рядом поёт громче всех, фальшиво, но так счастливо, что на неё оборачиваются. Ловит твой взгляд.",["Запою с ней вместе","Улыбнусь ей"],["Отвернусь к сцене","Отойду ближе к выходу"],["Покажу большой палец","«Громче, нас не слышно!»"]],
["Творчество","Ты долго рисовал открытку для мамы. Младший брат пролил на неё сок за пять минут до праздника.",["Дорисую пятно в солнце","Обниму брата: «Ничего, переживём»"],["Молча выброшу и куплю открытку","Подарю без открытки"],["Отругаю брата","Заставлю его рисовать новую вместе со мной"]],
["Друзья","Поход, третий день. Еда почти кончилась. Друг признаётся, что съел ночью последнюю шоколадку, которую «берегли на вершину».",["Посмеюсь и прощу","«Ладно, на вершине будет что-то другое»"],["Промолчу, но запомню","Отойду, чтобы не сорваться"],["«Ты серьёзно?!»","Заберу его порцию ужина в отместку"]],
["Дом","Семейный ужин. Тётя на весь стол: «Ну что, когда женишься?» Все замолкают и смотрят на тебя.",["«Как только найду такую, как ты, тётя»","Отвечу честно, как есть"],["Набью рот едой","Сменю тему на погоду"],["«Когда сам решу»","«А вы когда на пенсию?»"]],
["Незнакомцы","Поздний автобус. Пьяный мужчина садится рядом и начинает рассказывать тебе, как его все предали.",["Выслушаю, ему явно плохо","Спрошу, куда ему ехать"],["Надену наушники","Пересяду"],["«Извините, я устал»","Отвечу ему в тон, с юмором"]],
["Природа","Ты наконец выбрался на озеро. Только разложил плед, как на соседнее место приезжает компания с колонкой на полную громкость.",["Подойду познакомлюсь","Попрошу сделать потише, с улыбкой"],["Переберусь подальше","Уеду"],["Попрошу выключить","Включу свою музыку"]],
["Признание","На работе ты придумал, как сэкономить кучу времени. На собрании начальник рассказывает об этом как о своей идее.",["Порадуюсь, что идея пошла","Подхвачу: «Да, мы это обсуждали»"],["Промолчу","Перестану предлагать идеи"],["«Это была моя идея»","Поговорю с ним после собрания"]],
["Деньги","Друг продаёт тебе свою старую машину «по-дружески». Через неделю она ломается, ремонт дороже половины цены.",["Позвоню ему, разберёмся вместе","Починю, дружба дороже"],["Не скажу ему ничего","Продам дальше и забуду"],["Попрошу вернуть часть денег","«Ты знал и не сказал?»"]],
["Свобода","Ты на работе. Приходит общее сообщение: «С понедельника камеры в каждом кабинете и отчёт о каждом часе».",["Обсужу с коллегами, что делать","Схожу к начальнику поговорить"],["Начну тихо искать другую работу","Привыкну"],["«Я не буду так работать»","Заклею камеру стикером"]],
["Любовь","Девушка, которая тебе нравится, просит помочь с переездом. На месте оказывается, что её парень тоже там и командует.",["Помогу, раз обещал","Познакомлюсь с ним по-доброму"],["Помогу и тихо уеду","Скажу, что срочно позвали"],["Уеду сразу","Пошучу: «Я думал, будет пицца»"]],
["Творчество","Ты выложил видео, где учишь печь хлеб. Первый комментарий: «Руки бы оторвать, кто так месит».",["«Покажи, как ты месишь»","Отвечу с юмором"],["Удалю комментарий","Не буду читать комментарии"],["Отвечу резко","Сниму второе видео назло"]],
["Дом","Ночь. Ты на кухне делаешь бутерброд. Включается свет, на пороге папа в трусах с тем же намерением.",["Сделаю бутерброд и ему","«Садись, пополуночничаем»"],["Быстро уйду с бутербродом","Сделаю вид, что пью воду"],["«Это мой бутерброд»","«Ну-ну, ночной дожор?»"]],
["Незнакомцы","Ты в чужом городе, заблудился, телефон сел. Идёт местный дед с тележкой.",["Спрошу дорогу","Предложу помочь с тележкой и спрошу"],["Буду искать сам","Дождусь, пока появится кто-то помоложе"],["Пойду куда глаза глядят","Найду кафе и зарядку"]],
["Друзья","Ты рассказываешь смешную историю, а друг перебивает и рассказывает её концовку раньше тебя. Все смеются над ним.",["Посмеюсь вместе со всеми","«Ты прям у меня украл!»"],["Махну рукой","Замолчу до конца вечера"],["«Дай я доскажу»","Расскажу историю про него"]],
["Природа","Ты в лесу за грибами. Час, два — пусто. Выходишь на поляну, а там всё в белых грибах. И соседка с корзиной идёт прямо к ним.",["Позову её: «Давай вместе!»","Покажу ей пару, остальное себе"],["Отойду, пусть она","Пойду дальше искать свои"],["Побегу собирать первым","«Это моя поляна!»"]],
["Признание","Школьная встреча выпускников. Однокласснику аплодируют за то, что он стал директором. Тебя спрашивают: «А ты чем занимаешься?»",["Расскажу с гордостью про своё дело","Расскажу и спрошу про всех"],["«Да так, всяким»","Отшучусь и уйду к столу"],["«Я сам себе директор»","Покажу фото своей печи"]],
["Деньги","Ты выиграл в лотерею небольшую сумму, как раз на месячный отдых. Об этом пока никто не знает.",["Порадую семью","Устрою праздник друзьям"],["Положу на счёт и забуду","Никому не скажу"],["Поеду в путешествие сам","Вложу в своё дело"]],
["Свобода","Ты живёшь с родителями. Друг на встрече громко говорит: «Ну ты когда уже съедешь, взрослый мужик?»",["«Помогай искать квартиру»","Расскажу, почему так"],["Промолчу","Сменю тему"],["«Тебе-то что?»","«Зато ипотеки нет»"]],
["Любовь","Ты месяц переписывался с девушкой. Первая встреча. Она приходит с подругой «для безопасности», и подруга всё время говорит за неё.",["Подружусь с обеими","Предложу погулять втроём"],["Подыграю и тихо уйду","Буду просто слушать"],["«А можно с тобой отдельно?»","Пошучу: «Я тоже взял бы друга»"]],
["Творчество","Тебя попросили сделать сайт для местного кафе «за бесплатный кофе». Работы на неделю.",["Сделаю, это будет моё портфолио","Предложу сделать попроще, но быстро"],["«Подумаю»","Не отвечу"],["«Кофе на год, и договорились»","«Бесплатно не работаю»"]],
["Дом","Ты чинил кран три часа. Мама заходит: «Так надо было мастера вызвать». Кран снова капает.",["«Помоги, подержи ключ»","Посмеюсь: «Мастер устал»"],["Брошу и уйду","Вызову мастера молча"],["«Сам починю, не мешай»","Буду чинить до победы"]],

$("hm").onclick=()=>{st={name:st.name,s:[],g:[],friend:null};save();home()}}
function codeBox(code,text,msg){return`<div style="font:500 16px var(--disp);word-break:break-all;background:var(--sand);color:var(--sand-fg);padding:12px;border-radius:10px;user-select:all" id="cd">${esc(code)}</div>
<div class="row"><button class="main-btn" id="cp">Скопировать</button><a class="n" style="padding:11px 16px;border:1px solid var(--line);border-radius:10px;color:var(--fg);text-decoration:none" href="https://t.me/share/url?url=${encodeURIComponent(link())}&text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Отправить в Telegram</a></div><p class="note" style="margin:0" id="cpn">${text}</p>`}
function wireCopy(msg){$("cp").onclick=()=>{navigator.clipboard.writeText(msg).then(()=>$("cpn").textContent="Скопировано вместе со ссылкой на игру.",()=>{getSelection().selectAllChildren($("cd"));$("cpn").textContent="Выделил код, скопируй вручную."})}}
/* все угадывают меня: герой отвечает, собирает коды друзей, видит рейтинг */
function heroShare(){
const code=enc("NG"),msg=`Угадай, как я поступлю, в игре «Ну-ну»: ${link()}\nМой код: ${code}`,G=st.guessers||[];
const sc=G.map(f=>({n:f.name,p:f.g.filter((x,k)=>hit(sit(k),st.s[k],x)>0).length})).sort((a,b)=>b.p-a.p);
const ops=G.length?st.s.map((x,k)=>.32+.68*G.filter(f=>Z(sit(k),f.g[k])>=0&&Z(sit(k),f.g[k])===Z(sit(k),x)).length/G.length):null;
const T=!!(API&&st.glink);
let h=`<h1>${esc(st.name)}: угадайте меня</h1><div class="card"><h2>${T?"Ссылка для друзей":"Код для друзей"}</h2>${T?linkBox("Разошли друзьям: каждый откроет ссылку в Telegram и угадает тебя. Когда кто-то ответит, бот пришлёт сообщение."):codeBox(code,"Разошли друзьям: каждый вставит код на старте, угадает тебя и пришлёт свой код в ответ.",msg)}</div>
<div class="card"><h2>Мосты к друзьям</h2>${sc.length?sc.map(r=>`<div class="res" style="flex-direction:row;justify-content:space-between"><span>${esc(r.n)}</span><span class="note">досок: ${r.p} из ${N}</span></div>`).join(""):`<p class="note" style="margin:0">${T?"Пока никого.":"Пока никого. Вставь код ответа друга."}</p>`}
${T?`<button class="n" id="rf" style="align-self:flex-start">Обновить</button>`:`<div class="row"><input id="fc" placeholder="NF...-Имя"><button class="n" id="ok">Добавить</button></div><div class="err" id="e"></div>`}</div>
<div class="card"><h2>Твой остров</h2>${island(st.s,st.s,ops)}<p class="note" style="margin:0">${G.length?"Чем ярче растение, тем больше друзей угадали этот ответ.":"Остров проявится, когда придут ответы друзей."}</p></div>
<button class="n" id="nw" style="align-self:flex-start">Новая игра</button>`;
app.innerHTML=h;$("nw").onclick=()=>{st={name:st.name,s:[],g:[],friend:null};save();home()};if(T){wireLink("Угадай, как я поступлю, в игре «Ну-ну»");$("rf").onclick=go;return}wireCopy(msg);$("fc").oninput=()=>$("e").textContent="";
$("ok").onclick=()=>{const f=dec($("fc").value);if(!f||f.type!=="F"){$("e").textContent="Нужен код ответа друга, он начинается на NF.";return}if(f.seed!==st.seed){$("e").textContent="Друг угадывал другие карточки. Пусть начнёт с твоего кода.";return}
st.guessers=G.filter(x=>x.name!==f.name).concat(f);save();heroShare()};
$("nw").onclick=()=>{st={name:st.name,s:[],g:[],friend:null};save();home()}}
function guessResult(){
const H=st.friend,hn=esc(H.name),L=["Не угадал","Почти угадал","Точно в цель"],code=enc("NF"),msg=`Я угадывал тебя в «Ну-ну». Мой код: ${code}`;
const v=[...Array(N)].map((_,k)=>hit(sit(k),H.s[k],st.g[k]));
let h=`<h1>Ты и ${hn}</h1>${bridgeCard(v,2,H.name,"Мост: ты и "+hn)}${API?`<p class="note">${hn} увидит ваш мост у себя: бот уже прислал сообщение.</p>`:`<div class="card"><h2>Отправь свой код в ответ</h2>${codeBox(code,"Так "+hn+" увидит ваш мост.",msg)}</div>`}<div class="card"><h2>По ситуациям</h2>`;
for(let k=0;k<N;k++){const a=hit(sit(k),H.s[k],st.g[k]);h+=`<div class="res"><div class="s">${k+1}. ${sit(k).q}</div><div>${hn}: ${esc(opt(sit(k),H.s[k]))}</div><div class="note">Ты думал: ${esc(opt(sit(k),st.g[k]))} <span class="tag ${a?"open":"fog"}">${L[a].toLowerCase()}</span></div></div>`}
h+=`</div><button class="n" id="nw" style="align-self:flex-start">Новая игра</button>`;
app.innerHTML=h;bridgeBtns(H.name);if(!API)wireCopy(msg);$("nw").onclick=()=>{st={name:st.name,s:[],g:[],friend:null};save();home()}}
/* мост вместо счёта: кооперация сближает, соревнование отдаляет. Доска = карточка, где вы поняли друг друга */
function bridge(v,max){let g=`<svg viewBox="0 0 320 76" style="width:100%;max-width:520px;display:block;margin:0 auto" role="img" aria-label="Мост из ${v.filter(x=>x>0).length} досок">
<rect width="320" height="76" rx="12" fill="var(--sea)"/><ellipse cx="14" cy="44" rx="30" ry="24" fill="var(--grass)"/><ellipse cx="306" cy="44" rx="30" ry="24" fill="var(--grass)"/>
<line x1="40" y1="30" x2="280" y2="30" stroke="#888780"/><line x1="40" y1="56" x2="280" y2="56" stroke="#888780"/>`;
v.forEach((x,k)=>{const cx=48+k*(224/(N-1))-7;g+=x?x>=max?`<rect x="${cx}" y="30" width="14" height="26" rx="2" fill="#BA7517"/>`:`<rect x="${cx+5.5}" y="30" width="3" height="26" rx="1.5" fill="#BA7517" opacity=".85"/>`:`<rect x="${cx}" y="35" width="14" height="16" rx="2" fill="none" stroke="#888780" stroke-dasharray="2 2"/>`});
return g+`</svg>`}
/* ponytail: стадии моста по Холлу (канат → верёвка → доски → камень); пороги в досках условные, подстроить по данным */
let bridges=ls.get("nunu-bridges")||{};
function addBridge(name,n){if(st.bridged===1||(st.bb=st.bb||{})[name])return;bridges[name]=(bridges[name]||0)+n;st.bb[name]=1;save();ls.set("nunu-bridges",bridges)}
const STG=[[0,"канатный"],[10,"верёвочный"],[30,"дощатый"],[60,"каменный"]],pl=(n,f)=>n%10===1&&n%100!==11?f[0]:n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?f[1]:f[2];
/* карточка моста: что значит, где вы сейчас, сколько до следующей стадии и как укрепить.
Близость цели подгоняет (goal-gradient, Kivetz et al. 2006); совместные дела сближают сильнее разговоров (Hall 2019) */
function bridgeCard(v,max,name,title){const b=v.filter(x=>x>=max).length,r=v.filter(x=>x&&x<max).length;addBridge(name,b+r/2);
const t=bridges[name]||0,i=STG.filter(s=>t>=s[0]).length-1,nx=STG[i+1],left=nx?Math.ceil(nx[0]-t):0;
return`<div class="card"><h2>${title}</h2>${bridge(v,max)}
<p style="margin:0">В этой игре: ${b} ${pl(b,["доска","доски","досок"])} и ${r} ${pl(r,["верёвочка","верёвочки","верёвочек"])}.</p>
<p class="note" style="margin:0">Доска — вы поняли друг друга точно. Верёвочка — почти угадали или понял только один. Пусто — пока не поняли.</p>
<div class="zone">Ваш мост сейчас — ${STG[i][1]}</div>
${nx?`<div style="height:8px;border-radius:99px;background:var(--line)" role="img" aria-label="Прогресс моста"><div style="height:100%;width:${Math.round((t-STG[i][0])/(nx[0]-STG[i][0])*100)}%;background:#BA7517;border-radius:99px"></div></div>
<p class="note" style="margin:0">До ${nx[1].replace(/ый$/,"ого")} моста ещё ${left} ${pl(left,["доска","доски","досок"])}. Верёвочка — полдоски. Мост копится от игры к игре.</p>`:`<p class="note" style="margin:0">Крепче моста не бывает.</p>`}
<div class="zone">Как укрепить мост</div>
<div class="row"><button class="main-btn" id="brd">Сделать дело вместе: +3 доски</button><button class="n" id="brp">Ещё партию</button></div>
<p class="note" style="margin:0">Общее дело в жизни сближает сильнее разговоров. Выберите его вместе, а когда сделаете — отметь в саду.</p></div>`}
function bridgeBtns(name){$("brd").onclick=()=>stepWeek(name);$("brp").onclick=()=>{st={name:st.name,seed:newSeed(),s:[],g:[],friend:null,started:1,mode:"duo",guessers:[]};save();go()}}
function result(){
const f=st.friend,fn=esc(f.name),L=["Не угадал","Почти угадал","Точно в цель"];
const v=[...Array(N)].map((_,k)=>hit(sit(k),f.s[k],st.g[k])+hit(sit(k),st.s[k],f.g[k]));
let h=`<h1>Ну-ну: ${esc(st.name)} и ${fn}</h1>${bridgeCard(v,4,f.name,"Ваш мост")}<div class="card"><h2>По ситуациям</h2>`;
for(let k=0;k<N;k++){const s=sit(k),a=hit(s,st.s[k],f.g[k]),b=hit(s,f.s[k],st.g[k]);
h+=`<div class="res"><div class="s">${k+1}. ${s.q}</div>
<div>Ты: ${esc(opt(s,st.s[k]))} <span class="tag ${a?"open":"fog"}">${fn}: ${L[a].toLowerCase()}</span></div>
<div>${fn}: ${esc(opt(s,f.s[k]))} <span class="tag ${b?"open":"fog"}">ты: ${L[b].toLowerCase()}</span></div>${s.gift&&f.g[k]!==PASS?`<div class="tag p" style="align-self:flex-start">${fn} дарит тебе: ${esc(opt(s,f.g[k]))}</div>`:""}</div>`}
h+=`</div>`;
[[st.s,f.g,"Твой остров"],[f.s,st.g,"Остров: "+fn]].forEach(([own,gs,title])=>{const c=[0,0,0];let open=0;
let all=0;own.forEach((x,k)=>{const z=Z(sit(k),x);if(z<0)return;all++;c[z]++;if(z===Z(sit(k),gs[k]))open++});
h+=`<div class="card"><h2>${title}</h2>${island(own,gs)}
<p class="note" style="margin:0">Сад ${c[0]} · лес ${c[1]} · скалы ${c[2]}. Яркое друг угадал (${open}), бледное пока в тумане (${all-open}).</p></div>`});
const J=API&&st.join;
h+=`${API?J?`<p class="note">${fn} увидит ваш мост у себя: бот уже прислал сообщение.</p>`:"":`<div class="card"><h2>Отправь свой код в ответ</h2><div style="font:500 16px var(--disp);word-break:break-all;background:var(--sand);color:var(--sand-fg);padding:12px;border-radius:10px;user-select:all">${esc(enc())}</div><p class="note" style="margin:0">Тогда и друг увидит, что вышло.</p></div>`}<p class="note">Туман — не ошибка, а повод спросить: «Почему ты так подумал?»</p><div class="row">${J?"":`<button class="main-btn" id="bk">${API?"Кто ещё ответил":"Показать мой код"}</button>`}<button class="n" id="nw">Сыграть с кем-то ещё</button></div>`;
app.innerHTML=h;bridgeBtns(f.name);if(!J)$("bk").onclick=()=>{st.friend=null;save();go()};$("nw").onclick=()=>{st={name:st.name,s:[],g:[],friend:null};save();home()}}
/* внутри Telegram ссылки на t.me открываем средствами Telegram */
document.addEventListener("click",e=>{const a=e.target.closest("a[href^='https://t.me/']");if(a&&TG){e.preventDefault();TG.openTelegramLink(a.href)}});
function busy(t){card(`<p style="margin:0">${t}</p>`)}
function oops(f){card(`<p style="margin:0">Не получилось связаться с сервером. Проверь интернет.</p><button class="main-btn" id="rt">Ещё раз</button>`);$("rt").onclick=f}
const linkBox=t=>`<div style="font:500 15px var(--disp);word-break:break-all;background:var(--sand);color:var(--sand-fg);padding:12px;border-radius:10px;user-select:all" id="cd">${esc(st.glink)}</div>
<div class="row"><button class="main-btn" id="snd">Отправить другу</button><button class="n" id="cp">Скопировать</button></div><p class="note" style="margin:0" id="cpn">${t}</p>`;
function wireLink(msg){$("snd").onclick=()=>TG.openTelegramLink("https://t.me/share/url?url="+encodeURIComponent(st.glink)+"&text="+encodeURIComponent(msg));
$("cp").onclick=()=>navigator.clipboard.writeText(st.glink).then(()=>$("cpn").textContent="Ссылка скопирована.",()=>{getSelection().selectAllChildren($("cd"));$("cpn").textContent="Выделил ссылку, скопируй вручную."})}
/* хозяин: игра ложится на сервер один раз, дальше только ссылка; кто ответил — видно здесь */
function shareTG(M){busy("Готовлю ссылку…");
(st.gid?Promise.resolve():API("/game","POST",{name:st.name,seed:st.seed,mode:M,s:st.s,g:M==="hero"?[]:st.g}).then(r=>{st.gid=r.id;st.glink=r.link;save()}))
.then(()=>API("/game/"+st.gid)).then(v=>{const P=v.plays;
if(M==="hero"){st.guessers=P.map(p=>({name:p.name,g:p.g}));save();heroShare();return tail(M)}
card(`<span class="who">Готово</span><h2>Позови друга</h2><p style="margin:0">Друг откроет ссылку в Telegram, ответит на те же 10 карточек, и вы оба увидите мост.</p>
${linkBox("Когда друг ответит, бот пришлёт тебе сообщение.")}
<div class="zone">Уже ответили</div>${P.length?`<div class="row">${P.map((p,k)=>`<button class="t" data-k="${k}">${esc(p.name)}</button>`).join("")}</div>`:`<p class="note" style="margin:0">Пока никто.</p>`}
<div class="row"><button class="n" id="rf">Обновить</button><button class="n" id="rs">Начать заново</button></div>`);
wireLink("Сыграй со мной в «Ну-ну»");$("rf").onclick=go;$("rs").onclick=()=>{st={name:st.name,s:[],g:[],friend:null};save();home()};
app.querySelectorAll("button[data-k]").forEach(b=>b.onclick=()=>{const p=P[+b.dataset.k];st.friend={name:p.name,s:p.s,g:p.g,seed:st.seed};save();go()});tail(M)},()=>oops(go))}
/* друг пришёл по ссылке: его ответы уходят на сервер, в ответ приходят ответы хозяина */
function sendPlay(){busy("Отправляю ответы…");API("/game/"+st.join+"/play","POST",{name:st.name,s:st.mode==="guess"?[]:st.s,g:st.g})
.then(v=>{st.friend={name:v.name,s:v.s,g:v.g,seed:v.seed};save();go()},()=>oops(sendPlay))}
async function join(sp){const v=await API("/game/"+sp),md=v.mode==="hero"?"guess":"duo";
if(v.mine){st={name:v.name,seed:v.seed,s:v.s,g:v.mode==="hero"?v.s:v.g,mode:v.mode,started:1,planted:1,gid:v.id,glink:v.link,friend:null,guessers:[]};return}
st=v.played?{name:v.my.name,seed:v.seed,s:md==="guess"?v.my.g:v.my.s,g:v.my.g,mode:md,started:1,planted:1,join:sp,friend:{name:v.name,s:v.s,g:v.g,seed:v.seed}}
:{name:st.name||tgName||"Друг",seed:v.seed,s:[],g:[],mode:md,started:1,join:sp,friend:{name:v.name,pending:1}};save()}
async function boot(){if(!API)return go();busy("Загружаю твой остров…");
try{const r=await API("/state"),d=r.data;tgName=r.name||"";
if(d){if(d.nunu2)st=d.nunu2;if(d["nunu-seeds"])seeds=d["nunu-seeds"];if(d["nunu-bridges"])bridges=d["nunu-bridges"]}else push();
const sp=(TG.initDataUnsafe||{}).start_param;if(sp&&sp!==st.gid&&sp!==st.join)await join(sp)}catch(e){}
go()}
boot();
</script>
</body></html>
